name: Build and Deploy A.I. na lang! to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Ren'Py SDK
        id: cache-renpy
        uses: actions/cache@v4
        with:
          path: /opt/renpy
          key: renpy-8.3.7

      - name: Download and extract Ren'Py SDK
        if: steps.cache-renpy.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Ren'Py SDK 8.3.7..."
          curl -L -o /tmp/renpy.tar.bz2 \
            "https://www.renpy.org/dl/8.3.7/renpy-8.3.7-sdk.tar.bz2"
          echo "Extracting Ren'Py SDK..."
          sudo mkdir -p /opt/renpy
          sudo tar -xjf /tmp/renpy.tar.bz2 -C /opt
          sudo mv /opt/renpy-8.3.7-sdk/* /opt/renpy/
          rm /tmp/renpy.tar.bz2
          echo "Ren'Py SDK ready at /opt/renpy/"

      - name: Build web distribution
        run: |
          python3 /opt/renpy/renpy.py . web_build
          echo "Checking build output..."
          ls -la web_build/ 2>/dev/null || echo "No web_build dir"
          mkdir -p dist
          if [ -d "web_build" ]; then
            cp -r web_build/* dist/
            echo "Copied web_build to dist/"
          else
            echo "Build failed"
            exit 1
          fi

      - name: List dist contents
        run: |
          echo "dist/ has $(find dist/ -type f | wc -l) files"
          find dist/ -type f | head -20

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
