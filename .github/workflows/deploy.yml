name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libgles2 wget unzip

      - name: Download Ren'Py SDK 8.3.7
        run: |
          wget -q "https://www.renpy.org/dl/8.3.7/renpy-8.3.7-sdk.tar.bz2" \
            -O "$HOME/renpy-sdk.tar.bz2"
          tar -xjf "$HOME/renpy-sdk.tar.bz2" -C "$HOME/"
          mv "$HOME/renpy-8.3.7-sdk" "$HOME/renpy-sdk"
          chmod +x "$HOME/renpy-sdk/renpy.sh"
          echo "$HOME/renpy-sdk" >> "$GITHUB_PATH"

      - name: Install Ren'Py Web Platform
        run: |
          wget -q "https://www.renpy.org/dl/8.3.7/renpy-8.3.7-web.zip" \
            -O "$HOME/renpy-web.zip"
          mkdir -p "$HOME/renpy-sdk/web"
          unzip -q "$HOME/renpy-web.zip" -d "$HOME/renpy-sdk/web"

          SUBDIR=$(find "$HOME/renpy-sdk/web" -mindepth 1 -maxdepth 1 -type d | head -1)
          TOP_FILES=$(find "$HOME/renpy-sdk/web" -maxdepth 1 -type f | wc -l)
          if [ -n "$SUBDIR" ] && [ "$TOP_FILES" -eq 0 ]; then
            echo "Flattening $SUBDIR into web/"
            mv "$SUBDIR"/* "$HOME/renpy-sdk/web/"
            rmdir "$SUBDIR" 2>/dev/null || true
          fi

          echo "=== Web platform contents ==="
          ls -la "$HOME/renpy-sdk/web/" | head -20

          # Verify key files exist
          if [ ! -f "$HOME/renpy-sdk/web/index.html" ]; then
            echo "WARNING: index.html not found in web platform"
          fi

      - name: Build Web Distribution
        run: |
          export RENPY_NO_STEAM=1
          export SDL_VIDEODRIVER=dummy
          export SDL_AUDIODRIVER=dummy

          Xvfb :99 -screen 0 1280x720x24 &
          XVFB_PID=$!
          sleep 2
          export DISPLAY=:99

          mkdir -p "$GITHUB_WORKSPACE/dist-raw" "$GITHUB_WORKSPACE/dist"

          echo "=== Step 1: Compile game bytecode ==="
          "$HOME/renpy-sdk/renpy.sh" \
            "$GITHUB_WORKSPACE" \
            compile \
            --no-archive || true

          echo "=== Step 2: Run launcher distribute for web ==="
          "$HOME/renpy-sdk/renpy.sh" \
            "$HOME/renpy-sdk/launcher" \
            distribute \
            "$GITHUB_WORKSPACE" \
            --package web \
            --destination "$GITHUB_WORKSPACE/dist-raw" || true

          echo "=== Step 3: Inspect web platform HTML files ==="
          find "$HOME/renpy-sdk/web" -name "*.html" -o -name "index.*" | head -10

          echo "=== Step 4: List dist-raw structure ==="
          find "$GITHUB_WORKSPACE/dist-raw" -type f -name "*.html" -o -name "*.js" 2>/dev/null | head -20

          kill "$XVFB_PID" 2>/dev/null || true

      - name: Extract web build to dist/
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"

          # Try to find and extract the web zip
          WEB_ZIP=$(find "$GITHUB_WORKSPACE/dist-raw" -name "*-web.zip" | head -1)

          if [ -n "$WEB_ZIP" ]; then
            echo "Found: $WEB_ZIP"
            unzip -q "$WEB_ZIP" -d "$GITHUB_WORKSPACE/dist"

            # Check if it has HTML files
            if find "$GITHUB_WORKSPACE/dist" -name "*.html" -o -name "*.js" | grep -q .; then
              echo "Web build contains HTML/JS files"
              INDEX=$(find "$GITHUB_WORKSPACE/dist" -name "index.html" | head -1)
              if [ -n "$INDEX" ]; then
                IDIR=$(dirname "$INDEX")
                if [ "$IDIR" != "$GITHUB_WORKSPACE/dist" ]; then
                  cp -r "$IDIR"/. "$GITHUB_WORKSPACE/dist/"
                fi
              fi
            else
              echo "Web zip only contains runtime, checking for web platform..."
              # The web platform should have the player
              if [ -f "$HOME/renpy-sdk/web/index.html" ]; then
                echo "Using web platform index.html"
                cp "$HOME/renpy-sdk/web/index.html" "$GITHUB_WORKSPACE/dist/"
                cp "$HOME/renpy-sdk/web/"*.js "$GITHUB_WORKSPACE/dist/" 2>/dev/null || true
                cp "$HOME/renpy-sdk/web/"*.css "$GITHUB_WORKSPACE/dist/" 2>/dev/null || true
              fi
            fi
          else
            echo "WARNING: No web zip found in dist-raw"
            # Try to use web platform directly
            if [ -f "$HOME/renpy-sdk/web/index.html" ]; then
              cp -r "$HOME/renpy-sdk/web/"* "$GITHUB_WORKSPACE/dist/" 2>/dev/null || true
            fi
          fi

          # Verify index.html exists
          if [ ! -f "$GITHUB_WORKSPACE/dist/index.html" ]; then
            echo "ERROR: index.html not found. Creating fallback..."
            mkdir -p "$GITHUB_WORKSPACE/dist"
            printf '%s\n' \
              '<!DOCTYPE html>' \
              '<html>' \
              '<head>' \
              '  <meta charset="utf-8">' \
              '  <title>A.I. na lang!</title>' \
              '  <style>' \
              '    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #000; }' \
              '    .error { color: #f00; text-align: center; }' \
              '  </style>' \
              '</head>' \
              '<body>' \
              '  <div class="error">' \
              '    <h1>Web Build Error</h1>' \
              '    <p>The web build did not produce the expected files.</p>' \
              '    <p>This may indicate an issue with the Ren'"'"'Py web platform.</p>' \
              '  </div>' \
              '</body>' \
              '</html>' > "$GITHUB_WORKSPACE/dist/index.html"
          fi

          echo "=== Final dist/ contents ==="
          ls -la "$GITHUB_WORKSPACE/dist/" | head -20

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
