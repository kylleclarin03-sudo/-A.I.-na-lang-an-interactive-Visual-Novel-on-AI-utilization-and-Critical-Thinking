name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Xvfb and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libgles2 p7zip-full wget

      - name: Download Ren'Py SDK
        run: |
          wget -q \
            "https://www.renpy.org/dl/8.3.7/renpy-8.3.7-sdk.tar.bz2" \
            -O "$HOME/renpy-sdk.tar.bz2"
          tar -xjf "$HOME/renpy-sdk.tar.bz2" -C "$HOME/"
          mv "$HOME/renpy-8.3.7-sdk" "$HOME/renpy-sdk"
          chmod +x "$HOME/renpy-sdk/renpy.sh"

      - name: Install Ren'Py Web Platform
        run: |
          wget -q \
            "https://www.renpy.org/dl/8.3.7/renpy-8.3.7-web.zip" \
            -O "$HOME/renpy-web.zip"
          unzip -q "$HOME/renpy-web.zip" -d "$HOME/"
          mv "$HOME/renpy-8.3.7-web" "$HOME/renpy-sdk/web"
          echo "Web platform installed at $HOME/renpy-sdk/web"
          ls "$HOME/renpy-sdk/web" | head -10

      - name: Build Web Distribution via Launcher
        run: |
          export RENPY_NO_STEAM=1
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 2
          export DISPLAY=:99
          "$HOME/renpy-sdk/renpy.sh" \
            "$HOME/renpy-sdk/launcher" \
            distribute \
            "$GITHUB_WORKSPACE" \
            --package web \
            --destination "$GITHUB_WORKSPACE/dist-raw"
          echo "--- Raw build output ---"
          find "$GITHUB_WORKSPACE/dist-raw" -maxdepth 3 | head -30

      - name: Collect web files into dist/
        run: |
          WEB_ZIP=$(find "$GITHUB_WORKSPACE/dist-raw" \
            -name "*-web.zip" | head -n 1)
          if [ -z "$WEB_ZIP" ]; then
            echo "No web zip found. Full dist-raw listing:"
            find "$GITHUB_WORKSPACE/dist-raw" -maxdepth 4
            exit 1
          fi
          echo "Found: $WEB_ZIP"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          unzip -q "$WEB_ZIP" -d "$GITHUB_WORKSPACE/dist"
          echo "--- dist/ top-level ---"
          ls -lh "$GITHUB_WORKSPACE/dist/"
          echo "--- Searching for index.html ---"
          find "$GITHUB_WORKSPACE/dist" -name "index.html" | head -5
          INDEX_PATH=$(find "$GITHUB_WORKSPACE/dist" -name "index.html" | head -1)
          if [ -z "$INDEX_PATH" ]; then
            echo "ERROR: index.html not found. Full dist tree:"
            find "$GITHUB_WORKSPACE/dist" -maxdepth 5
            exit 1
          fi
          INDEX_DIR=$(dirname "$INDEX_PATH")
          if [ "$INDEX_DIR" != "$GITHUB_WORKSPACE/dist" ]; then
            echo "index.html found in subdirectory, moving to root"
            cp -r "$INDEX_DIR"/. "$GITHUB_WORKSPACE/dist/"
          fi
          echo "--- Final dist/ ---"
          ls -lh "$GITHUB_WORKSPACE/dist/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4