name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libgles2 wget unzip

      - name: Download Ren'Py SDK
        run: |
          wget -q "https://www.renpy.org/dl/8.3.7/renpy-8.3.7-sdk.tar.bz2" \
            -O "$HOME/renpy-sdk.tar.bz2"
          tar -xjf "$HOME/renpy-sdk.tar.bz2" -C "$HOME/"
          mv "$HOME/renpy-8.3.7-sdk" "$HOME/renpy-sdk"
          chmod +x "$HOME/renpy-sdk/renpy.sh"

      - name: Install Ren'Py Web Platform
        run: |
          wget -q "https://www.renpy.org/dl/8.3.7/renpy-8.3.7-web.zip" \
            -O "$HOME/renpy-web.zip"
          mkdir -p "$HOME/renpy-sdk/web"
          unzip -q "$HOME/renpy-web.zip" -d "$HOME/renpy-sdk/web"
          # If zip created a subdirectory, flatten it
          SUBDIR=$(find "$HOME/renpy-sdk/web" -mindepth 1 -maxdepth 1 -type d | head -1)
          if [ -n "$SUBDIR" ] && [ -z "$(find "$HOME/renpy-sdk/web" -maxdepth 1 -type f -name '*.js')" ]; then
            echo "Flattening $SUBDIR"
            mv "$SUBDIR"/* "$HOME/renpy-sdk/web/"
            rmdir "$SUBDIR" 2>/dev/null || true
          fi
          echo "Web platform contents:"
          ls "$HOME/renpy-sdk/web/"

      - name: Build Web Distribution
        run: |
          export RENPY_NO_STEAM=1
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 2
          export DISPLAY=:99
          mkdir -p "$GITHUB_WORKSPACE/dist-raw"
          "$HOME/renpy-sdk/renpy.sh" \
            "$HOME/renpy-sdk/launcher" \
            distribute \
            "$GITHUB_WORKSPACE" \
            --package web \
            --destination "$GITHUB_WORKSPACE/dist-raw"
          echo "=== dist-raw contents ==="
          find "$GITHUB_WORKSPACE/dist-raw" -maxdepth 2

      - name: Extract web build to dist/
        run: |
          WEB_ZIP=$(find "$GITHUB_WORKSPACE/dist-raw" -name "*-web.zip" | head -1)
          if [ -z "$WEB_ZIP" ]; then
            echo "No web zip found:"
            find "$GITHUB_WORKSPACE/dist-raw"
            exit 1
          fi
          echo "Using: $WEB_ZIP"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          unzip -q "$WEB_ZIP" -d "$GITHUB_WORKSPACE/dist"
          # Flatten if needed
          INDEX=$(find "$GITHUB_WORKSPACE/dist" -name "index.html" | head -1)
          if [ -z "$INDEX" ]; then
            echo "No index.html — full tree:"
            find "$GITHUB_WORKSPACE/dist"
            exit 1
          fi
          IDIR=$(dirname "$INDEX")
          if [ "$IDIR" != "$GITHUB_WORKSPACE/dist" ]; then
            cp -r "$IDIR"/. "$GITHUB_WORKSPACE/dist/"
          fi
          echo "=== Final dist/ ==="
          ls "$GITHUB_WORKSPACE/dist/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4