name: Build and Deploy A.I. na lang! to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Ren'Py SDK
        id: cache-renpy
        uses: actions/cache@v4
        with:
          path: ~/renpy-sdk
          key: renpy-8.3.7-${{ runner.os }}

      - name: Download and extract Ren'Py SDK
        if: steps.cache-renpy.outputs.cache-hit != 'true'
        run: |
          set -e
          echo "Downloading Ren'Py SDK 8.3.7..."
          curl -L -o /tmp/renpy.tar.bz2 --retry 3 --fail \
            "https://www.renpy.org/dl/8.3.7/renpy-8.3.7-sdk.tar.bz2"
          echo "Extracting Ren'Py SDK..."
          mkdir -p ~/renpy-sdk
          tar -xjf /tmp/renpy.tar.bz2 -C ~/renpy-sdk --strip-components=1
          rm /tmp/renpy.tar.bz2
          chmod +x ~/renpy-sdk/renpy.sh
          echo "Ren'Py SDK ready at ~/renpy-sdk/"

      - name: Install Ren'Py dependencies
        run: |
          set -e
          echo "Installing system dependencies for Ren'Py..."
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3-dev \
            libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 libsdl2-ttf-2.0-0 \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
          echo "Installing Python dependencies..."
          python3 -m pip install --upgrade pip setuptools cython future
          echo "Ren'Py dependencies installed"

      - name: Build web distribution
        run: |
          set -e
          echo "Running Ren'Py bootstrap (builds pygame_sdl2 for system Python)..."
          python3 ~/renpy-sdk/renpy.py ~/renpy-sdk bootstrap
          echo "Building web distribution..."
          python3 ~/renpy-sdk/renpy.py . web_build
          echo "Checking build output..."
          ls -la web_build/ 2>/dev/null || echo "No web_build dir"
          mkdir -p dist
          if [ -d "web_build" ]; then
            cp -r web_build/* dist/
            echo "Copied web_build to dist/"
          else
            echo "Build failed"
            exit 1
          fi

      - name: List dist contents
        run: |
          set -e
          echo "dist/ has $(find dist/ -type f | wc -l) files"
          find dist/ -type f | head -20

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
